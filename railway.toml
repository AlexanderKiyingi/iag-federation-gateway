# Railway config-as-code for iag-federation-gateway (repo root = service root).
# Root directory must be `/`. Do not set a custom buildCommand — the Dockerfile
# owns the build. Without this file Railway falls back to Railpack, which cannot
# infer a build for a Go service that vendors platform-go.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Final Dockerfile stage is `standalone` (vendored third_party/platform-go).
# Monorepo compose/CI uses --target monorepo.

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway probes the PORT variable (not ADDR). Keep PORT=4021 in service
# variables or rely on the Dockerfile ENV so healthchecks hit the API listener.
