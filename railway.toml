# Railway config-as-code for iag-federation-gateway (repo root = service root).
# Root directory must be `/`. Do not set a custom buildCommand — the Dockerfile
# owns the build. The final stage is `standalone`; the monorepo Compose build
# uses --target monorepo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway probes the PORT variable (not ADDR). Keep PORT=4021 in service
# variables or rely on the Dockerfile default so healthchecks reach the API.
